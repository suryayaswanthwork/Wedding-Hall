<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initialscale=1.0">
 <title>Book Hall</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
 <nav class="navbar">
 <div class="logo">HallBooker</div>
 <ul class="nav-links">
 <li><a href="index.html" datai18n="nav_home">Home</a></li>
 <li><a href="halls.html" datai18n="nav_halls">Halls</a></li>
 <li><a href="dashboard.html" datai18n="nav_dashboard">Dashboard</a></li>
 </ul>
 <div class="nav-actions">
 <button id="lang-toggle" onclick="toggleLanguage()">EN /
TE</button>
 </div>
 </nav>
 <div class="container mt-4">
 <div class="auth-card">
 <h2 data-i18n="book_title">Confirm Booking</h2>
 <h4 id="bookingHallName" class="mt-2 textprimary"></h4>

 <form id="bookingForm" class="mt-2"
onsubmit="handleBooking(event)">
 <div class="form-group">
 <label data-i18n="date_label">Date</label>
 <input type="date" id="bookDate" required>
 </div>
 <div class="form-group">
 <label data-i18n="guests_label">Number of
Guests</label>
 <input type="number" id="bookGuests" required
min="1">
 </div>
 <button type="submit" class="btn btn-large w-100" datai18n="confirm_btn">Confirm & Book</button>
 </form>
 </div>
 </div>
 <script src="script.js"></script>
 <script>
 document.addEventListener("DOMContentLoaded", () => {
 const urlParams = new
URLSearchParams(window.location.search);
 const id = urlParams.get('id');
 const hall = hallsData.find(h => h.id == id);
 if(hall)
document.getElementById('bookingHallName').innerText =
hall.name;
 });
 </script>
</body>
</html>
