<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="nav_halls">Halls - Hall Booking Platform</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">HallBooker</div>
    <ul class="nav-links">
      <li><a href="index.html" data-i18n="nav_home">Home</a></li>
      <li><a href="halls.html" data-i18n="nav_halls">Halls</a></li>
      <li><a href="services.html" data-i18n="nav_services">Services</a></li>
      <li><a href="about.html" data-i18n="nav_about">About</a></li>
      <li><a href="contact.html" data-i18n="nav_contact">Contact</a></li>
    </ul>
    <div class="nav-actions">
      <button id="lang-toggle" type="button" onclick="toggleLanguage()">EN / TE</button>
      <a href="login.html" class="btn" id="nav-login" data-i18n="nav_login">Login</a>
      <a href="dashboard.html" class="btn btn-outline" data-i18n="nav_dashboard">Dashboard</a>
      <button onclick="logout()" class="btn hidden" id="nav-logout" data-i18n="nav_logout">Logout</button>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="page-intro">
      <span class="eyebrow">Browse available spaces</span>
      <h2 data-i18n="halls_title">Available Venues</h2>
      <p>Find a place that fits your event, whether it is a wedding, guest stay, or storage requirement.</p>
    </div>

    <div class="search-bar">
      <input type="text" id="searchInput" data-placeholder-i18n="search_placeholder" placeholder="Search by name or type..." onkeyup="filterHalls()">
    </div>

    <div class="grid" id="hallsGrid">
      <!-- Halls are generated by script.js -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
