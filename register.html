<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initialscale=1.0">
 <title data-i18n="nav_register">Register</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
 <div class="container flex-center min-h-screen">
 <div class="auth-card text-center">
 <h2 data-i18n="nav_register">Register</h2>
 <form id="registerForm" onsubmit="handleRegister(event)"
class="mt-2 text-left">
 <div class="form-group">
 <label data-i18n="name_label">Full Name</label>
 <input type="text" id="regName" required>
 </div>
 <div class="form-group">
 <label data-i18n="email_label">Email</label>
 <input type="email" id="regEmail" required>
 </div>
 <div class="form-group">
 <label data-i18n="pass_label">Password</label>
 <input type="password" id="regPass" required>
 </div>
 <button type="submit" class="btn w-100" datai18n="nav_register">Register</button>
 </form>
 <p class="mt-2"><a href="login.html" datai18n="nav_login">Back to Login</a></p>
 </div>
 </div>
 <script src="script.js"></script>
</body>
</html>
